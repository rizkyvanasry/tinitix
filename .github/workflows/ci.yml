name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tinitix_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: tinitix_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tinitix_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tinitix_test:ci-test-only@127.0.0.1:5432/tinitix_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:db
      - name: Verify worker container and operations checks
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" npm run db:migrate
          docker build -f Dockerfile.worker -t tinitix-worker:ci .
          docker run --rm --network host \
            -e DATABASE_URL="$TEST_DATABASE_URL" \
            -e APP_SECRET=worker-ci-test-only-secret-at-least-32-characters \
            -e APP_URL=http://127.0.0.1:3100 \
            tinitix-worker:ci node node_modules/tsx/dist/cli.mjs scripts/worker.ts --once
          DATABASE_URL="$TEST_DATABASE_URL" npm run ops:check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
